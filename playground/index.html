<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="apply-to-css playground：用 Vite + Vue 3 + TypeScript + Tailwind CSS 展示 @apply 与 @reference 的转换效果。"
    />
    <title>apply-to-css playground</title>
    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem('apply-to-css-theme')
          const dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
        } catch {
          /* localStorage can be unavailable in private mode */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
